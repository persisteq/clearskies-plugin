interface:
  display_name: "Use Clearskies Revenue Data"
  short_description: "Query CRM, calls, and email data safely"
  default_prompt: "Use $use-clearskies-revenue-data to answer this revenue question from Clearskies data."

dependencies:
  tools:
    - type: "mcp"
      value: "clearskies"
      description: "Clearskies CRM and revenue-interaction data"
      transport: "streamable_http"
      url: "https://mcp.clearskies.cc/mcp"

policy:
  allow_implicit_invocation: true
