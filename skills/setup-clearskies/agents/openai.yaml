interface:
  display_name: "Set Up Clearskies"
  short_description: "Discover and refresh synced CRM context"
  default_prompt: "Use $setup-clearskies to discover or refresh my synced Clearskies CRM schema."

dependencies:
  tools:
    - type: "mcp"
      value: "clearskies"
      description: "Clearskies tenant CRM schema discovery"
      transport: "streamable_http"
      url: "https://mcp.clearskies.cc/mcp"

policy:
  allow_implicit_invocation: true
